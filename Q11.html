
<!DOCTYPE html>
<html>
<head>
    <title>Display BCA Content</title>
</head>

<body>

    <h2>BCA Description</h2>

    <button onclick="loadData()">Display BCA Content</button>

    <p id="content"></p>

    <script>
        function loadData() {

            // Create XMLHttpRequest object
            var xhttp = new XMLHttpRequest();

            // Define what happens when response is received
            xhttp.onreadystatechange = function() {

                if (this.readyState == 4 && this.status == 200) {
                    document.getElementById("content").innerHTML =
                        this.responseText;
                }
            };

            // Open bca.txt file
            xhttp.open("GET", "bca.txt", true);

            // Send request
            xhttp.send();
        }
    </script>

</body>
</html>
