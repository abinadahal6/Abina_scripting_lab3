<!DOCTYPE html>
<html>
<head>
<style>
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #333; padding: 6px; text-align: left; font-size: 0.9em; }
    img { width: 50px; height: auto; }
</style>
</head>
<body>

<h2>Movies List</h2>
<table id="movieTable">
    <tr>
        <th>ID</th><th>Title</th><th>Poster</th><th>Year</th><th>Genre</th>
        <th>Rating</th><th>Director</th><th>Country</th><th>Language</th><th>Actors</th>
    </tr>
</table>

<script>
var xhr = new XMLHttpRequest();
xhr.open("GET", "https://freetestapi.com/api/v1/movies", true);
xhr.onreadystatechange = function() {
    if (xhr.readyState === 4 && xhr.status === 200) {
        var movies = JSON.parse(xhr.responseText);
        var table = document.getElementById("movieTable");

        movies.forEach(function(movie) {
            var genre = Array.isArray(movie.genre) ? movie.genre.join(", ") : movie.genre;
            var language = Array.isArray(movie.language) ? movie.language.join(", ") : movie.language;
            var actors = Array.isArray(movie.actors) ? movie.actors.join(", ") : movie.actors;

            var row = "<tr>" +
                "<td>" + movie.id + "</td>" +
                "<td>" + movie.title + "</td>" +
                "<td><img src='" + movie.poster + "'></td>" +
                "<td>" + movie.year + "</td>" +
                "<td>" + genre + "</td>" +
                "<td>" + movie.rating + "</td>" +
                "<td>" + movie.director + "</td>" +
                "<td>" + movie.country + "</td>" +
                "<td>" + language + "</td>" +
                "<td>" + actors + "</td>" +
                "</tr>";
            table.innerHTML += row;
        });
    }
};
xhr.send();
</script>

</body>
</html>
